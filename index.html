<script>


// 星空粒子效果


const canvas =
document.getElementById("stars");


const ctx =
canvas.getContext("2d");



let w,h;


function resize(){

w=canvas.width=window.innerWidth;

h=canvas.height=window.innerHeight;

}


resize();


window.onresize=resize;



let stars=[];


for(let i=0;i<180;i++){

stars.push({

x:Math.random()*w,

y:Math.random()*h,

r:Math.random()*2,

speed:Math.random()*0.5

});

}



function draw(){


ctx.clearRect(0,0,w,h);



ctx.fillStyle="#fff";



stars.forEach(s=>{


ctx.beginPath();

ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
);


ctx.fill();



s.y+=s.speed;



if(s.y>h){

s.y=0;

s.x=Math.random()*w;

}


});



requestAnimationFrame(draw);


}



draw();


</script>
